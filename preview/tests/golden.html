<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>共用測試</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; margin: 24px; background: #1f2230; color: #e8e8ef; }
  h1 { font-size: 20px; }
  .pass { color: #6fdc8c; } .fail { color: #ff7a85; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>共用測試 <span id="status">執行中…</span></h1>
<p>和桌寵（Godot）比對同一份答案 <code>tests/golden/pose.json</code>：角色＋動作＋時間 → 各骨骼世界座標與表情。答案由 Godot 產生（<code>--selftest=golden --update</code>）。</p>
<pre id="log"></pre>
<script type="module">
import { PATHS } from "../js/config.js";
import { loadCharacters, loadAnimations, formRig } from "../js/core/loader.js";
import { Skeleton } from "../js/core/skeleton.js";
import { sampleTrack } from "../js/core/animator.js";
import { Spring } from "../js/core/spring.js";
import { overlayDeltas } from "../js/core/overlay.js";
import { MOTION } from "../js/config.js";

const POS_TOLERANCE = 0.01, ANGLE_TOLERANCE = 0.01, PHYSICS_TOLERANCE = 0.05;
const log = text => { document.getElementById("log").textContent += text + "\n"; };

// 和 Godot ClipData.FaceAt 一樣：字串，或 [[時間, 表情], ...]
function faceAt(clip, t) {
  const f = clip.face;
  if (typeof f === "string") return f;
  if (!Array.isArray(f)) return "idle";
  let value = f[0][1];
  for (const [k, name] of f) if (t >= k) value = name;
  return value;
}

// 和 Pet.Probe 一樣：直接取樣關鍵影格（不含交叉淡化、視線），再算骨架
function compute(c, rigs, sets) {
  const [id, form] = c.char.split("@");
  const rig = formRig(rigs[id], form);
  const clip = sets.for(rig)[c.clip];
  // Godot 用 float（32 位元）算 frac × duration，這裡也轉成 32 位元，時間才會一致
  const t = Math.fround(Math.fround(c.frac) * Math.fround(clip.duration));
  const pose = {};
  for (const [ch, keys] of Object.entries(clip.tracks)) pose[ch] = sampleTrack(keys, t) * (c.mods?.[ch] ?? 1);
  const world = new Skeleton(rig.bones, rig.rootScale ?? 1, rig.trackScale ?? {}).compute(pose);
  const bones = {};
  for (const b of rig.bones) {
    const m = world[b.name];
    bones[b.name] = [m[4], m[5], Math.atan2(m[1], m[0]) * 180 / Math.PI];
  }
  return { face: faceAt(clip, t), bones };
}

// 次級物理（tests/golden/physics.json）：和 Godot 的 Golden.SimulatePhysics 一樣，身體用 Q 版單位（縮放 1），每幀 1/60 秒
function simulatePhysics(c, rigs, sets) {
  const [id, form] = c.char.split("@");
  const rig = formRig(rigs[id], form);
  const clip = sets.for(rig)[c.clip];
  const skeleton = new Skeleton(rig.bones, rig.rootScale ?? 1, rig.trackScale ?? {});
  const spring = new Spring(rig.bones, rig.physics);
  const dt = 1 / 60, result = {};
  let x = 0, facing = 1;
  for (let n = 0; n < c.frames; n++) {
    if (n < c.moveUntil) x += c.vx * dt;
    if (n === c.flipAt) facing = -facing;
    const t = Math.fround((n * dt) % Math.fround(clip.duration));
    const pose = {};
    for (const [ch, keys] of Object.entries(clip.tracks)) pose[ch] = sampleTrack(keys, t);
    const offsets = spring.update(dt, skeleton.compute(pose), x, 0, 1, facing);
    if (c.samples.includes(n)) result[n] = { ...offsets };
  }
  return result;
}

const angleDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

function* compare(expected, actual) {
  if (expected.face !== actual.face) yield `表情 ${expected.face} ≠ ${actual.face}`;
  for (const [name, e] of Object.entries(expected.bones)) {
    const a = actual.bones[name];
    if (!a) { yield `少了骨骼 ${name}`; continue; }
    if (Math.abs(e[0] - a[0]) > POS_TOLERANCE || Math.abs(e[1] - a[1]) > POS_TOLERANCE)
      yield `${name} 位置 (${e[0]}, ${e[1]}) ≠ (${a[0].toFixed(4)}, ${a[1].toFixed(4)})`;
    if (angleDiff(e[2], a[2]) > ANGLE_TOLERANCE) yield `${name} 角度 ${e[2]} ≠ ${a[2].toFixed(4)}`;
  }
}

const status = document.getElementById("status");
try {
  const doc = await (await fetch(`${PATHS.art}/../tests/golden/pose.json`)).json();
  const { rigs } = await loadCharacters();
  const bodies = new Set(Object.values(rigs).flatMap(r => [r, ...Object.values(r.forms ?? {}).map(f => f.data)]).map(r => r.body ?? "humanoid"));
  const { sets } = await loadAnimations(bodies);
  if (doc.expected.length !== doc.cases.length) throw new Error(`expected 有 ${doc.expected.length} 個，cases 有 ${doc.cases.length} 個（先在 Godot 跑 --update）`);
  let failures = 0;
  doc.cases.forEach((c, i) => {
    for (const problem of compare(doc.expected[i], compute(c, rigs, sets)))
      if (failures++ < 30) log(`✗ ${c.char} ${c.clip} frac=${c.frac}：${problem}`);
  });
  const phys = await (await fetch(`${PATHS.art}/../tests/golden/physics.json`)).json();
  phys.cases.forEach((c, i) => {
    const got = simulatePhysics(c, rigs, sets);
    for (const [frame, bones] of Object.entries(phys.expected[i] ?? {}))
      for (const [bone, want] of Object.entries(bones))
        if (!(Math.abs(want - (got[frame]?.[bone] ?? NaN)) <= PHYSICS_TOLERANCE) && failures++ < 30)
          log(`✗ 物理 ${c.char} ${c.clip} 第 ${frame} 幀 ${bone}：${want} ≠ ${got[frame]?.[bone]}`);
  });
  const curves = await (await fetch(`${PATHS.art}/../tests/golden/curves.json`)).json();
  curves.samples.forEach((t, i) => {
    const got = sampleTrack(curves.keys, Math.fround(t));
    if (!(Math.abs(got - curves.expected[i]) <= 0.001) && failures++ < 30) log(`✗ 曲線 t=${t}：${curves.expected[i]} ≠ ${got}`);
  });
  const ov = await (await fetch(`${PATHS.art}/../tests/golden/overlay.json`)).json();
  ov.cases.forEach((c, i) => {
    const got = overlayDeltas(MOTION, c.action, c.time), want = ov.expected[i] ?? {};
    for (const k of new Set([...Object.keys(want), ...Object.keys(got)]))
      if (!(Math.abs((want[k] ?? NaN) - (got[k] ?? NaN)) <= 0.0005) && failures++ < 30) log(`✗ 疊加層 ${c.action} t=${c.time} ${k}：${want[k]} ≠ ${got[k]}`);
  });
  status.textContent = failures ? `✗ ${failures} 個不一致` : `✓ 全部通過（姿勢 ${doc.cases.length} 個、物理 ${phys.cases.length} 個、曲線 ${curves.samples.length} 個、疊加層 ${ov.cases.length} 個）`;
  status.className = failures ? "fail" : "pass";
  document.title = failures ? `FAIL ${failures}` : "PASS";
} catch (e) {
  status.textContent = `✗ ${e.message}`;
  status.className = "fail";
  document.title = "ERROR";
}
</script>
</body>
</html>
