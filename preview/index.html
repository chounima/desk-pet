<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Desk Pet Preview</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/collection.css">
</head>
<body>
  <!-- 模擬桌面 -->
  <div id="wallpaper"></div>
  <svg id="world"><g id="pets"></g></svg>
  <div id="fx"></div>
  <div id="taskbar">
    <span>⌨️ <b id="score">0</b>　<b id="points"></b> <span id="volleyHud"></span> <span id="debugHud"></span></span>
    <span id="clock"></span>
  </div>

  <!-- 控制面板 -->
  <aside id="panel">
    <h1>Desk Pet</h1>
    <h2>角色</h2>
    <div class="buttons" data-characters></div>
    <div class="buttons" data-forms hidden></div>
    <h2>動作</h2>
    <div class="buttons" data-actions></div>
    <h2>小遊戲</h2>
    <div class="buttons" data-games></div>
    <div class="buttons" data-collection></div>
    <label class="toggle"><input type="checkbox" data-auto checked> 自動行為</label>
    <p class="hint">
      打字 → 拿出筆電一起打<br>
      點她 → 揮手／歡呼<br>
      拖曳 → 抓起來，放開會掉下去<br>
      30 秒沒動作 → 睡覺<br>
      對打：游標快速揮過球來擊球，或直接點球
    </p>
    <a href="gallery.html">→ 動作總覽</a>
  </aside>

  <!-- 收藏視窗 -->
  <section id="collection" class="window" hidden>
    <header><b>📖 收藏</b><span data-points></span><button data-close>✕</button></header>
    <h3>今日點數</h3>
    <div data-today></div>
    <h3>角色</h3>
    <div class="cards" data-chars></div>
  </section>

  <!-- 解鎖提示 -->
  <div id="toast" hidden></div>

  <!-- 開發者模式（?dev=1） -->
  <section id="dev" class="window" hidden>
    <header><b>🛠 開發者模式</b></header>
    <div class="buttons">
      <button data-dev="points">💎 +100</button>
      <button data-dev="xp">❤ +50（目前角色）</button>
      <button data-dev="nextDay">⏭ 隔天</button>
      <button data-dev="reset">🗑 重置進度</button>
    </div>
    <h3>參數（data/progression.json）</h3>
    <textarea data-cfg spellcheck="false"></textarea>
    <div class="buttons">
      <button data-dev="apply">套用</button>
      <button data-dev="restore">還原預設</button>
      <span class="muted" data-status></span>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
